<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scribe — record, transcribe, and summarize your meetings with AI. Your meetings from the Android app, in the browser.">
  <meta name="theme-color" content="#1A8C7E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scribe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Scribe — AI meeting notes</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Brand splash while the Flutter engine loads. */
    html, body { height: 100%; margin: 0; background: #F5F4F0; }
    #scribe-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #scribe-splash .mark {
      width: 84px; height: 84px; border-radius: 24px; background: #E8F9F7;
      display: flex; align-items: center; justify-content: center;
    }
    #scribe-splash .mark svg { width: 52px; height: 52px; }
    #scribe-splash .name { color: #10695D; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    #scribe-splash .bars { display: flex; gap: 5px; align-items: flex-end; height: 28px; }
    #scribe-splash .bars span {
      width: 5px; border-radius: 3px; background: #1A8C7E; opacity: .85;
      animation: sb 1.1s ease-in-out infinite;
    }
    @keyframes sb { 0%,100%{height:8px} 50%{height:26px} }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121212; }
      #scribe-splash .name { color: #7FD4C8; }
    }
  </style>
</head>
<body>
  <div id="scribe-splash">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A8C7E" stroke-width="3" stroke-linecap="round"><path d="M16.5 7.5 C16.5 5 10.5 4.25 9.25 7 C8 10 15.5 10.5 15.5 14 C15.5 17.5 9.5 18 7.75 15.25"/></svg>
    </div>
    <div class="name">Scribe</div>
    <div class="bars">
      <span style="animation-delay:-.9s"></span><span style="animation-delay:-.45s"></span>
      <span style="animation-delay:-.7s"></span><span style="animation-delay:-.15s"></span>
      <span style="animation-delay:-.55s"></span>
    </div>
  </div>
  <script>
    // Remove the splash once Flutter's first frame is up.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('scribe-splash');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
